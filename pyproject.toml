[project]
name = "eugene-bus-reliability"
dynamic = ["version"]  # read from eugene_bus_reliability/__init__.py
description = "Eugene Bus Watch: how reliable are Lane Transit District's buses, and how far can you trust the arrival sign? Built from LTD's public GTFS and GTFS-Realtime feeds."
readme = "README.md"
# 3.12 is the oldest Python the pinned numpy (constraints.txt) supports; Docker and CI use 3.14.
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "httpx>=0.27,<1",                    # HTTP client (fetching the feeds)
  "psycopg[binary]>=3.2,<4",           # Postgres driver
  "gtfs-realtime-bindings>=1.0.0,<3",  # Google's generated Python classes for the GTFS-RT protobuf
  "protobuf>=4.25,<7",
]


[project.urls]
Homepage = "https://eugenebuswatch.com"
Source = "https://github.com/blemberger/eugene-bus-reliability"

[project.optional-dependencies]
pipeline = ["dbt-postgres>=1.8,<2"]
dev = ["pytest>=8,<10", "ruff>=0.6", "dbt-postgres>=1.8,<2"]
app = ["streamlit>=1.64,<2", "pandas>=2.2,<4", "plotly>=5.24,<8", "pydeck>=0.9,<1"]

# Hatchling installs the package without leaving a *.egg-info folder in the project.
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "eugene_bus_reliability/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["eugene_bus_reliability"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Long lines inside SQL strings and CSV fixtures are clearer unwrapped.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs TEST_DATABASE_URL pointing at a database with sql/schema applied"]