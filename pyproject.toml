[project]
name = "ltdwatch"
version = "0.1.0"
description = "Warehouse and reliability analysis for Lane Transit District (Eugene, OR) built from public GTFS and GTFS-Realtime feeds."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "httpx>=0.27,<1",                    # HTTP client (fetching the feeds)
  "psycopg[binary]>=3.2,<4",           # Postgres driver
  "gtfs-realtime-bindings>=1.0.0,<3",  # Google's generated Python classes for the GTFS-RT protobuf
  "protobuf>=4.25,<7",
]


[project.urls]
Homepage = "https://github.com/blemberger/eugene-bus-reliability"
Source = "https://github.com/blemberger/eugene-bus-reliability"

[project.optional-dependencies]
pipeline = ["dbt-postgres>=1.8,<2"]
dev = ["pytest>=8,<10", "ruff>=0.6", "dbt-postgres>=1.8,<2"]
app = ["streamlit>=1.64,<2", "pandas>=2.2,<4", "plotly>=5.24,<8", "pydeck>=0.9,<1"]

[project.scripts]
ltdwatch = "ltdwatch.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ltdwatch*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Long lines inside SQL strings and CSV fixtures are clearer unwrapped.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs TEST_DATABASE_URL pointing at a database with sql/schema applied"]